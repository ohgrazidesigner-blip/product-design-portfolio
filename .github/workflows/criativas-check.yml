name: Criativas checks

on:
  pull_request:
    paths:
      - 'public/criativas/**'
      - 'api/orcamento.js'
      - 'tests/criativas-orcamento.test.js'
      - '.github/workflows/criativas-check.yml'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build portfolio with Criativas page
        run: npm run build
      - name: Verify generated static landing and assets
        run: |
          test -s dist/criativas/index.html
          test -s dist/criativas/base.css
          test -s dist/criativas/ajustes.css
          test -s dist/criativas/formulario.js
      - name: Test serverless quote endpoint
        run: node --test tests/criativas-orcamento.test.js
